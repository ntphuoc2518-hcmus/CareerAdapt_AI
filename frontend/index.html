<!doctype html>
<html lang="vi" data-build="5.65.0">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B1F45">
    <meta name="robots" content="noindex, nofollow">
    <title>CareerAdapt AI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <script src="/js/boot.js?v=5.65.0"></script>
    <link rel="stylesheet" href="/css/tokens.css?v=5.65.0">
    <link rel="stylesheet" href="/css/vendor/codemirror.css?v=5.65.0">
    <link rel="stylesheet" href="/css/app.css?v=5.65.0">
    <link rel="stylesheet" href="/css/faces.css?v=5.65.0">
    <link rel="stylesheet" href="/css/ambient.css?v=5.65.0">
    <link rel="stylesheet" href="/css/effects.css?v=5.65.0">
</head>
<body>
    <a class="skip-link" href="#view">Bỏ qua điều hướng</a>
    <div class="shell">
        <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
            <a class="brand" href="#/">
                <span class="brand-mark" aria-hidden="true"><img src="/img/logo-mark-white.png" alt="" width="44" height="39"></span>
                <span><strong>CareerAdapt AI</strong></span>
            </a>
            <nav id="nav"></nav>
            <div class="sidebar-foot">
                <section class="ai-card" id="ai-card" hidden>
                    <div class="ai-card-stage" aria-hidden="true"><img class="ai-card-mascot" src="/img/ai-mascot-full.webp" alt="" width="440" height="574" decoding="async"></div>
                    <strong id="ai-card-title">Khám phá tiềm năng cùng Trợ lý AI</strong>
                    <p class="ai-card-note" id="ai-card-note" hidden></p>
                    <button class="btn btn-primary btn-sm" type="button" id="ai-card-open">Trò chuyện ngay</button>
                    <a class="btn btn-secondary btn-sm" id="ai-card-resume" href="#/" hidden>Quay lại bài đang làm</a>
                </section>
                <p class="sidebar-note">Kết quả chỉ phản ánh các bài đã đo, không phải chứng chỉ nghề hay bảo đảm được tuyển.</p>
                <p class="sidebar-version" id="app-version">CareerAdapt AI</p>
            </div>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Mở menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
                <button class="icon-btn rail-btn" id="rail-btn" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Thu gọn thanh bên" title="Thu gọn thanh bên"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/><path class="rail-arrow" d="M15.5 9.5 13 12l2.5 2.5"/></svg></button>
                <div class="page-title"><span id="page-icon" aria-hidden="true"></span><h1 id="page-title">CareerAdapt AI</h1></div>
                <div class="topbar-right">
                    <div class="lang-switch" role="group" aria-label="Ngôn ngữ"><button type="button" data-lang-option="vi">VI</button><button type="button" data-lang-option="en">EN</button></div>
                    <button class="theme-toggle" type="button" data-theme-cycle aria-label="Giao diện"><svg data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6Z"/></svg><svg data-theme-icon="system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg></button>
                    <div class="bell-wrap"><button class="icon-btn bell" type="button" aria-label="Nhắc nhở" id="bell" aria-haspopup="true" aria-expanded="false" aria-controls="bell-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9Zm4 10a2 2 0 0 0 4 0"/></svg><span class="badge-count" id="bell-count" hidden>0</span></button><div class="bell-panel" id="bell-panel" role="dialog" aria-label="Nhắc nhở" hidden></div></div>
                    <a class="user-chip" href="#/profile"><span class="avatar" id="user-avatar" data-user-avatar aria-hidden="true"></span><span class="user-text"><strong id="user-name"></strong><small id="user-role"></small></span></a>
                    <button class="btn btn-ghost btn-sm" id="logout" type="button">Đăng xuất</button>
                </div>
            </header>
            <div id="flow-bar" class="flow-bar-slot" hidden></div>
            <div class="view-shell" id="view-shell">
                <nav id="subnav" class="subnav" aria-label="Mục trong Kế hoạch" hidden></nav>
                <main id="view" tabindex="-1"></main>
            </div>
        </div>
    </div>
    <button class="assistant-fab" id="assistant-fab" type="button" aria-label="Mở Trợ lý CareerAdapt AI" aria-expanded="false" aria-controls="assistant-panel" hidden><span class="ai-avatar ai-avatar-fab fab-blink" aria-hidden="true"><img src="/img/ai-avatar-open.webp" alt="" width="46" height="46"><img class="fab-blink-closed" src="/img/ai-avatar-closed.webp" alt="" width="46" height="46"></span><span class="assistant-fab-label"><span>Trợ lý</span></span></button>
    <aside class="assistant-panel" id="assistant-panel" aria-label="Trợ lý CareerAdapt AI" hidden>
        <header class="assistant-head">
            <span class="assistant-title"><span class="ai-avatar ai-avatar-md fab-blink" aria-hidden="true"><img src="/img/ai-avatar-open.webp" alt="" width="34" height="34"><img class="fab-blink-closed" src="/img/ai-avatar-closed.webp" alt="" width="34" height="34"></span><strong>Trợ lý CareerAdapt AI</strong></span>
            <div class="assistant-actions">
                <button class="assistant-head-btn is-new" type="button" data-assistant="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Mới</span></button>
                <button class="assistant-head-btn" type="button" data-assistant="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-13v5l3 2M3 4v4h4"/></svg><span>Lịch sử</span></button>
                <button class="assistant-head-btn is-close" type="button" data-assistant="close" aria-label="Đóng trợ lý"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Đóng</span></button>
            </div>
        </header>
        <div class="assistant-body"></div>
        <form class="assistant-form">
            <div class="assistant-compose">
                <div class="assistant-attachment" hidden><img alt="" width="44" height="44"><span class="assistant-attachment-name"></span><button type="button" class="assistant-attachment-remove" data-assistant="detach" aria-label="Bỏ ảnh đính kèm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
                <textarea class="assistant-input" rows="2" maxlength="4000" placeholder="Hỏi về kỹ năng, JD, lộ trình hoặc tiến độ của bạn..." aria-label="Câu hỏi cho trợ lý"></textarea>
                <div class="assistant-tools">
                    <button type="button" class="assistant-tool" data-assistant="attach" aria-label="Đính kèm ảnh" title="Đính kèm ảnh (PNG, JPG, WebP, tối đa 5 MB)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.7 17.7a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
                    <button type="button" class="assistant-tool" data-assistant="voice" aria-label="Nói để nhập câu hỏi" aria-pressed="false" title="Nói để nhập câu hỏi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm-7 9a7 7 0 0 0 14 0M12 19v3"/></svg></button>
                    <span class="assistant-voice-state" aria-live="polite"></span>
                </div>
                <input type="file" id="assistant-file" accept="image/png,image/jpeg,image/webp" hidden>
            </div>
            <button class="assistant-send" type="submit" aria-label="Gửi"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M3.4 20.4 21 12 3.4 3.6 3 10.2 15 12 3 13.8Z"/></svg><span>Gửi</span></button>
        </form>
    </aside>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="chart-tip" class="chart-tip" hidden></div>
    <script src="/js/i18n.js?v=5.65.0"></script>
    <script src="/js/password.js?v=5.65.0"></script>
    <script src="/js/vendor/codemirror.js?v=5.65.0"></script>
    <script src="/js/vendor/mode/sql.js?v=5.65.0"></script>
    <script src="/js/vendor/mode/python.js?v=5.65.0"></script>
    <script src="/js/vendor/mode/markdown.js?v=5.65.0"></script>
    <script src="/js/vendor/addon/matchbrackets.js?v=5.65.0"></script>
    <script src="/js/vendor/addon/closebrackets.js?v=5.65.0"></script>
    <script src="/js/vendor/marked.min.js?v=5.65.0"></script>
    <script src="/js/vendor/purify.min.js?v=5.65.0"></script>
    <script type="module" src="/js/main.js?v=5.65.0"></script>
</body>
</html>
